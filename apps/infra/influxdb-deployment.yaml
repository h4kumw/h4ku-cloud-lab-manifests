apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o ../k8s/manifests/infra/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: influxdb
  name: influxdb
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: influxdb
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o ../k8s/manifests/infra/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: influxdb
    spec:
      containers:
        - env:
            - name: INFLUXDB_ADMIN_PASSWORD
              value: admin123
            - name: INFLUXDB_ADMIN_USER
              value: admin
            - name: INFLUXDB_DB
              value: cps_telemetry
          image: influxdb:2.7
          livenessProbe:
            exec:
              command:
                - influx
                - ping
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: influxdb
          ports:
            - containerPort: 8086
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/influxdb2
              name: influxdb-data
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: influxdb-data
