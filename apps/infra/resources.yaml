- apiVersion: v1
  data:
    01_telemetry.sql: |
      -- Game Analytics Database
      CREATE DATABASE IF NOT EXISTS game_analytics;

      -- Farcana Match Telemetry
      CREATE TABLE IF NOT EXISTS game_analytics.match_telemetry (
          event_time DateTime,
          match_id String,
          player_id String,
          event_type String,
          lat Float64,
          lon Float64,
          ping UInt16 DEFAULT 0,
          server_id String DEFAULT ''
      ) ENGINE = MergeTree()
      PARTITION BY toYYYYMMDD(event_time)
      ORDER BY (match_id, event_time)
      TTL event_time + INTERVAL 90 DAY;

      -- Chimeras NFT Analytics
      CREATE TABLE IF NOT EXISTS game_analytics.nft_transactions (
          timestamp DateTime,
          tx_hash String,
          nft_id String,
          from_address String,
          to_address String,
          price Float64
      ) ENGINE = MergeTree()
      PARTITION BY toYYYYMMDD(timestamp)
      ORDER BY (tx_hash, timestamp)
      TTL timestamp + INTERVAL 365 DAY;

      -- CPS Sensor Telemetry
      CREATE TABLE IF NOT EXISTS game_analytics.sensor_data (
          timestamp DateTime,
          device_id String,
          sensor_type String,
          value Float64,
          unit String,
          location String
      ) ENGINE = MergeTree()
      PARTITION BY toYYYYMMDD(timestamp)
      ORDER BY (device_id, timestamp)
      TTL timestamp + INTERVAL 30 DAY;

      -- CPS Aggregated Data (Edge)
      CREATE TABLE IF NOT EXISTS game_analytics.sensor_aggregates (
          window_time DateTime,
          device_id String,
          sensor_type String,
          avg_value Float64,
          min_value Float64,
          max_value Float64,
          sample_count UInt32
      ) ENGINE = MergeTree()
      PARTITION BY toYYYYMMDD(window_time)
      ORDER BY (device_id, window_time)
      TTL window_time + INTERVAL 90 DAY;

      -- Kyriba Financial Analytics
      CREATE TABLE IF NOT EXISTS game_analytics.financial_reports (
          report_date Date,
          bank_code String,
          total_transactions UInt32,
          total_volume Float64,
          avg_transaction Float64
      ) ENGINE = MergeTree()
      PARTITION BY toYYYYMMDD(report_date)
      ORDER BY (bank_code, report_date);
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"01_telemetry.sql":"-- Game Analytics Database\nCREATE DATABASE IF NOT EXISTS game_analytics;\n\n-- Farcana Match Telemetry\nCREATE TABLE IF NOT EXISTS game_analytics.match_telemetry (\n    event_time DateTime,\n    match_id String,\n    player_id String,\n    event_type String,\n    lat Float64,\n    lon Float64,\n    ping UInt16 DEFAULT 0,\n    server_id String DEFAULT ''\n) ENGINE = MergeTree()\nPARTITION BY toYYYYMMDD(event_time)\nORDER BY (match_id, event_time)\nTTL event_time + INTERVAL 90 DAY;\n\n-- Chimeras NFT Analytics\nCREATE TABLE IF NOT EXISTS game_analytics.nft_transactions (\n    timestamp DateTime,\n    tx_hash String,\n    nft_id String,\n    from_address String,\n    to_address String,\n    price Float64\n) ENGINE = MergeTree()\nPARTITION BY toYYYYMMDD(timestamp)\nORDER BY (tx_hash, timestamp)\nTTL timestamp + INTERVAL 365 DAY;\n\n-- CPS Sensor Telemetry\nCREATE TABLE IF NOT EXISTS game_analytics.sensor_data (\n    timestamp DateTime,\n    device_id String,\n    sensor_type String,\n    value Float64,\n    unit String,\n    location String\n) ENGINE = MergeTree()\nPARTITION BY toYYYYMMDD(timestamp)\nORDER BY (device_id, timestamp)\nTTL timestamp + INTERVAL 30 DAY;\n\n-- CPS Aggregated Data (Edge)\nCREATE TABLE IF NOT EXISTS game_analytics.sensor_aggregates (\n    window_time DateTime,\n    device_id String,\n    sensor_type String,\n    avg_value Float64,\n    min_value Float64,\n    max_value Float64,\n    sample_count UInt32\n) ENGINE = MergeTree()\nPARTITION BY toYYYYMMDD(window_time)\nORDER BY (device_id, window_time)\nTTL window_time + INTERVAL 90 DAY;\n\n-- Kyriba Financial Analytics\nCREATE TABLE IF NOT EXISTS game_analytics.financial_reports (\n    report_date Date,\n    bank_code String,\n    total_transactions UInt32,\n    total_volume Float64,\n    avg_transaction Float64\n) ENGINE = MergeTree()\nPARTITION BY toYYYYMMDD(report_date)\nORDER BY (bank_code, report_date);\n"},"kind":"ConfigMap","metadata":{