- apiVersion: v1
  data:
    01_schema.sql: |
      -- Farcana Game Schema (OLTP)
      CREATE TABLE IF NOT EXISTS matches (
          match_id UUID PRIMARY KEY,
          created_at TIMESTAMP DEFAULT NOW(),
          region VARCHAR(10)
      );

      CREATE TABLE IF NOT EXISTS players (
          player_id UUID PRIMARY KEY,
          nickname VARCHAR(50),
          skill_level INT,
          created_at TIMESTAMP DEFAULT NOW()
      );

      CREATE TABLE IF NOT EXISTS match_players (
          match_id UUID REFERENCES matches(match_id),
          player_id UUID REFERENCES players(player_id),
          joined_at TIMESTAMP DEFAULT NOW(),
          PRIMARY KEY (match_id, player_id)
      );

      -- Chimeras Web3 Schema
      CREATE TABLE IF NOT EXISTS nft_transactions (
          tx_hash VARCHAR(66) PRIMARY KEY,
          nft_id VARCHAR(50),
          from_address VARCHAR(42),
          to_address VARCHAR(42),
          price DECIMAL(18,2),
          timestamp TIMESTAMP DEFAULT NOW()
      );

      -- Kyriba Finance Schema
      CREATE TABLE IF NOT EXISTS bank_statements (
          id SERIAL PRIMARY KEY,
          statement_date DATE,
          bank_code VARCHAR(10),
          total_amount DECIMAL(18,2),
          processed_at TIMESTAMP DEFAULT NOW()
      );
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"01_schema.sql":"-- Farcana Game Schema (OLTP)\nCREATE TABLE IF NOT EXISTS matches (\n    match_id UUID PRIMARY KEY,\n    created_at TIMESTAMP DEFAULT NOW(),\n    status VARCHAR(20) DEFAULT 'pending',\n    region VARCHAR(10)\n);\n\nCREATE TABLE IF NOT EXISTS players (\n    player_id UUID PRIMARY KEY,\n    nickname VARCHAR(50),\n    skill_level INT,\n    created_at TIMESTAMP DEFAULT NOW()\n);\n\nCREATE TABLE IF NOT EXISTS match_players (\n    match_id UUID REFERENCES matches(match_id),\n    player_id UUID REFERENCES players(player_id),\n    joined_at TIMESTAMP DEFAULT NOW(),\n    PRIMARY KEY (match_id, player_id)\n);\n\n-- Chimeras Web3 Schema\nCREATE TABLE IF NOT EXISTS nft_transactions (\n    tx_hash VARCHAR(66) PRIMARY KEY,\n    nft_id VARCHAR(50),\n    from_address VARCHAR(42),\n    to_address VARCHAR(42),\n    price DECIMAL(18,2),\n    timestamp TIMESTAMP DEFAULT NOW()\n);\n\n-- Kyriba Finance Schema\nCREATE TABLE IF NOT EXISTS bank_statements (\n    id SERIAL PRIMARY KEY,\n    statement_date DATE,\n    bank_code VARCHAR(10),\n    total_amount DECIMAL(18,2),\n    processed_at TIMESTAMP DEFAULT NOW()\n);\n"},"kind":"ConfigMap","metadata":{"annotations":{},"labels":{"io.kompose.service":"postgres"},"name":"postgres-cm1","namespace":"infra"}}
