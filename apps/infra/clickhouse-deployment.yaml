apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o ../k8s/manifests/infra/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: clickhouse
  name: clickhouse
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: clickhouse
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o ../k8s/manifests/infra/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: clickhouse
    spec:
      containers:
        - env:
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: CLICKHOUSE_PASSWORD
              value: admin
            - name: CLICKHOUSE_USER
              value: admin
          image: clickhouse/clickhouse-server:latest
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
          name: clickhouse
          ports:
            - containerPort: 8123
              protocol: TCP
            - containerPort: 9000
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/clickhouse
              name: ch-data
            - mountPath: /docker-entrypoint-initdb.d
              name: clickhouse-cm1
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: ch-data
          persistentVolumeClaim:
            claimName: ch-data
        - configMap:
            name: clickhouse-cm1
          name: clickhouse-cm1
