apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o ../k8s/manifests/infra/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: mosquitto
  name: mosquitto
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mosquitto
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o ../k8s/manifests/infra/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: mosquitto
    spec:
      containers:
        - image: eclipse-mosquitto:latest
          livenessProbe:
            exec:
              command:
                - mosquitto_sub -h localhost -t '$SYS/broker/uptime' -C 1 -W 3 || exit 1
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          name: mosquitto
          ports:
            - containerPort: 1883
              protocol: TCP
            - containerPort: 9001
              protocol: TCP
          volumeMounts:
            - mountPath: /mosquitto/config
              name: mosquitto-cm0
            - mountPath: /mosquitto/data
              name: mosquitto-data
            - mountPath: /mosquitto/log
              name: mosquitto-log
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
      volumes:
        - configMap:
            name: mosquitto-cm0
          name: mosquitto-cm0
        - name: mosquitto-data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: mosquitto-log
          persistentVolumeClaim:
            claimName: mosquitto-log
