apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  namespace: infra
  labels:
    io.kompose.service: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: controller
      port: 9093
      targetPort: 9093
    - name: external
      port: 9092
      targetPort: 9092
  selector:
    io.kompose.service: kafka
