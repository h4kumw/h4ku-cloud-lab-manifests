apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-ingressroutes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/h4kumw/h4ku-cloud-lab-manifests.git
    targetRevision: main
    path: apps/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # не важно, IngressRoutes сами указывают ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
