apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airflow
  namespace: airflow
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`airflow.cloud-lab.local`)
      kind: Rule
      services:
        - name: airflow-api-server
          port: 8080
