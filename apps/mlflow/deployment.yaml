apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v3.17.1   # ← MLflow 3.x!
        command:
        - /bin/bash
        - -c
        args:
        - |
          pip install --no-cache-dir psycopg2-binary boto3 sqlalchemy &&
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri postgresql://admin:postgres@postgres.infra.svc.cluster.local:5432/mlflow \
            --default-artifact-root s3://mlflow/ \
            --serve-artifacts \
            --artifacts-destination s3://mlflow/
        env:
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://minio.infra.svc.cluster.local:9000
        - name: AWS_ACCESS_KEY_ID
          value: minioadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: minioadmin
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        ports:
        - containerPort: 5000
