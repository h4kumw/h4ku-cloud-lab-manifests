apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyriba-simulator
  namespace: data-platform
  labels:
    app: kyriba-simulator
    case: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyriba-simulator
  template:
    metadata:
      labels:
        app: kyriba-simulator
        case: finops
    spec:
      containers:
      - name: simulator
        image: ghcr.io/h4kumw/cloud-lab-simulators:kyriba_finance-latest
        imagePullPolicy: Always
        command:
        - python3
        - -u
        - kyriba_finance.py
        env:
        - name: MINIO_ENDPOINT
          value: http://minio.infra.svc.cluster.local:9000
        - name: MINIO_USER
          value: minioadmin
        - name: MINIO_PASSWORD
          value: minioadmin
        - name: CH_HOST
          value: clickhouse.infra.svc.cluster.local
        - name: CH_PORT
          value: '8123'
        - name: CH_USER
          value: admin
        - name: CH_PASSWORD
          value: admin
        - name: PG_HOST
          value: postgres.infra.svc.cluster.local
        - name: PG_PORT
          value: '5432'
        - name: PG_USER
          value: admin
        - name: PG_PASSWORD
          value: postgres
        - name: PG_DB
          value: farcana
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
