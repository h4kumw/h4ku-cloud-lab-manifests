apiVersion: apps/v1
kind: Deployment
metadata:
  name: farcana-simulator
  namespace: data-platform
  labels:
    app: farcana-simulator
    case: gamedev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: farcana-simulator
  template:
    metadata:
      labels:
        app: farcana-simulator
        case: gamedev
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -zv postgres.infra.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-clickhouse
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -zv clickhouse.infra.svc.cluster.local 8123; do
                echo "Waiting for ClickHouse..."
                sleep 2
              done
              echo "ClickHouse is ready!"
      containers:
        - name: simulator
          image: ghcr.io/h4kumw/cloud-lab-simulators:farcana_director-latest
          imagePullPolicy: Always
          command: ["python3", "-u", "farcana_director.py"]
          env:
            - name: PG_HOST
              value: "postgres.infra.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: "admin"
            - name: PG_PASSWORD
              value: "postgres"
            - name: PG_DB
              value: "farcana"
            - name: CH_HOST
              value: "clickhouse.infra.svc.cluster.local"
            - name: CH_PORT
              value: "8123"
            - name: CH_USER
              value: "admin"
            - name: CH_PASSWORD
              value: "admin"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
