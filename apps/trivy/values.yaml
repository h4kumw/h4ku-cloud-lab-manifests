# Trivy Operator Helm values
trivy:
  ignoreUnfixed: true
  severity: "CRITICAL,HIGH"
  timeout: 5m

operator:
  scanJobTimeout: 5m
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: false   # чтобы не спамить

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
