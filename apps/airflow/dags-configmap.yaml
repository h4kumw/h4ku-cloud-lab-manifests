apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags-cm
  namespace: airflow
data:
  farcana_etl.py: "\"\"\"Farcana ETL: PostgreSQL \u2192 ClickHouse (batch \u043A\u0430\u0436\u0434\u044B\u0435 5 \u043C\u0438\u043D\u0443\u0442).\"\"\"\nfrom airflow import DAG\nfrom airflow.providers.standard.operators.python import PythonOperator\nfrom airflow.providers.postgres.hooks.postgres import PostgresHook\nfrom datetime import datetime, timedelta\nimport json\nimport requests\n\n\nCLICKHOUSE_URL = \"http://clickhouse.infra.svc.cluster.local:8123/\"\nCLICKHOUSE_PARAMS = {\"user\": \"admin\", \"password\": \"admin\"}\nBATCH_SIZE = 5000\n\n\ndef extract_from_postgres(**context):\n    pg_hook = PostgresHook(postgres_conn_id='postgres_farcana')\n\n    sql = \"\"\"\n        SELECT id, event_time, match_id, player_id, event_type,\n               lat, lon, ping, server_id\n        FROM match_telemetry\n        WHERE synced_to_ch = FALSE\n        ORDER BY event_time ASC\n        LIMIT %s\n    \"\"\"\n    records = pg_hook.get_records(sql, parameters=(BATCH_SIZE,))\n\n    if not records:\n        print(\"No new records\")\n        return []\n\n    data = [dict(zip(\n        ['id', 'event_time', 'match_id', 'player_id', 'event_type', 'lat', 'lon', 'ping', 'server_id'],\n        r\n    )) for r in records]\n\n    print(f\"Extracted {len(data)} records from PostgreSQL\")\n    return data\n\n\ndef load_to_clickhouse(**context):\n    ti = context['ti']\n    data = ti.xcom_pull(task_ids='extract_from_postgres')\n\n    if not data:\n        print(\"No data to load\")\n        return 0\n\n    lines = []\n    for row in data:\n        event_time = row['event_time']\n        if hasattr(event_time, 'isoformat'):\n            event_time = event_time.isoformat()\n        lines.append(json.dumps({\n            \"event_time\": event_time,\n            \"match_id\":   row['match_id'],\n            \"player_id\":  row['player_id'],\n            \"event_type\": row['event_type'],\n            \"lat\":        row['lat'],\n            \"lon\":        row['lon'],\n            \"ping\":       row['ping'],\n            \"server_id\":  row['server_id'] or '',\n        }, ensure_ascii=False))\n\n    body = \"\\n\".join(lines)\n\n    resp = requests.post(\n        CLICKHOUSE_URL,\n        params={\n            **CLICKHOUSE_PARAMS,\n            \"query\": \"INSERT INTO game_analytics.match_telemetry \"\n                     \"(event_time, match_id, player_id, event_type, lat, lon, ping, server_id) \"\n                     \"FORMAT JSONEachRow\",\n        },\n        data=body.encode(\"utf-8\"),\n        headers={\"Content-Type\": \"application/x-ndjson\"},\n        timeout=60,\n    )\n    if resp.status_code != 200:\n        raise Exception(f\"ClickHouse error ({resp.status_code}): {resp.text[:500]}\")\n\n    ids = [row['id'] for row in data]\n    pg_hook = PostgresHook(postgres_conn_id='postgres_farcana')\n    pg_hook.run(\n        \"UPDATE match_telemetry SET synced_to_ch = TRUE WHERE id = ANY(%s)\",\n        parameters=(ids,),\n    )\n\n    print(f\"Loaded {len(data)} records to ClickHouse (ids: {len(ids)})\")\n    return len(data)\n\n\nwith DAG(\n    dag_id='farcana_etl',\n    default_args={\n        'owner': 'devops',\n        'depends_on_past': False,\n        'start_date': datetime(2026, 9, 1),\n        'retries': 2,\n        'retry_delay': timedelta(minutes=1),\n    },\n    schedule='*/1 * * * *',\n    catchup=False,\n    max_active_runs=1,\n    max_active_tasks=1,\n    tags=['farcana', 'etl', 'oltp-olap'],\n) as dag:\n    extract = PythonOperator(task_id='extract_from_postgres', python_callable=extract_from_postgres)\n    load = PythonOperator(task_id='load_to_clickhouse', python_callable=load_to_clickhouse)\n    extract >> load\nprint(\"[DEMO] v2 built at $(date)\")\n"
  chimeras_etl.py: "\"\"\"Chimeras ETL: PostgreSQL nft_transactions \u2192 ClickHouse.\"\"\"\nfrom airflow import DAG\nfrom airflow.providers.standard.operators.python import PythonOperator\nfrom airflow.providers.postgres.hooks.postgres import PostgresHook\nfrom datetime import datetime, timedelta\nimport json\nimport requests\n\n\nCLICKHOUSE_URL = \"http://clickhouse.infra.svc.cluster.local:8123/\"\nCLICKHOUSE_PARAMS = {\"user\": \"admin\", \"password\": \"admin\"}\nBATCH_SIZE = 5000\n\n\ndef extract_from_postgres(**context):\n    pg_hook = PostgresHook(postgres_conn_id='postgres_farcana')\n    sql = \"\"\"\n        SELECT tx_hash, nft_id, from_address, to_address, price, timestamp\n        FROM nft_transactions\n        WHERE synced_to_ch = FALSE\n        ORDER BY timestamp ASC\n        LIMIT %s\n    \"\"\"\n    records = pg_hook.get_records(sql, parameters=(BATCH_SIZE,))\n    if not records:\n        print(\"No new records\")\n        return []\n    data = [dict(zip(\n        ['tx_hash', 'nft_id', 'from_address', 'to_address', 'price', 'timestamp'],\n        r\n    )) for r in records]\n    print(f\"Extracted {len(data)} nft_transactions from PostgreSQL\")\n    return data\n\n\ndef load_to_clickhouse(**context):\n    ti = context['ti']\n    data = ti.xcom_pull(task_ids='extract_from_postgres')\n    if not data:\n        print(\"No data to load\")\n        return 0\n    lines = []\n    for row in data:\n        ts = row['timestamp']\n        if hasattr(ts, 'isoformat'):\n            ts = ts.isoformat()\n        lines.append(json.dumps({\n            \"timestamp\":    ts,\n            \"tx_hash\":      row['tx_hash'],\n            \"nft_id\":       row['nft_id'] or '',\n            \"from_address\": row['from_address'] or '',\n            \"to_address\":   row['to_address'] or '',\n            \"price\":        float(row['price']) if row['price'] is not None else 0.0,\n        }, ensure_ascii=False))\n    body = \"\\n\".join(lines)\n    resp = requests.post(\n        CLICKHOUSE_URL,\n        params={\n            **CLICKHOUSE_PARAMS,\n            \"query\": \"INSERT INTO game_analytics.nft_transactions \"\n                     \"(timestamp, tx_hash, nft_id, from_address, to_address, price) \"\n                     \"FORMAT JSONEachRow\",\n        },\n        data=body.encode(\"utf-8\"),\n        headers={\"Content-Type\": \"application/x-ndjson\"},\n        timeout=60,\n    )\n    if resp.status_code != 200:\n        raise Exception(f\"ClickHouse error ({resp.status_code}): {resp.text[:500]}\")\n    hashes = [row['tx_hash'] for row in data]\n    pg_hook = PostgresHook(postgres_conn_id='postgres_farcana')\n    pg_hook.run(\n        \"UPDATE nft_transactions SET synced_to_ch = TRUE WHERE tx_hash = ANY(%s)\",\n        parameters=(hashes,),\n    )\n    print(f\"Loaded {len(data)} nft_transactions to ClickHouse\")\n    return len(data)\n\n\nwith DAG(\n    dag_id='chimeras_etl',\n    default_args={\n        'owner': 'devops',\n        'depends_on_past': False,\n        'start_date': datetime(2026, 9, 1),\n        'retries': 2,\n        'retry_delay': timedelta(minutes=1),\n    },\n    schedule='*/1 * * * *',\n    catchup=False,\n    max_active_runs=1,\n    max_active_tasks=1,\n    tags=['chimeras', 'etl', 'oltp-olap'],\n) as dag:\n    extract = PythonOperator(task_id='extract_from_postgres', python_callable=extract_from_postgres)\n    load = PythonOperator(task_id='load_to_clickhouse', python_callable=load_to_clickhouse)\n    extract >> load\n"
  kyriba_etl.py: "\"\"\"Kyriba ETL: bank_statements (raw) \u2192 financial_reports (aggregated).\"\"\"\nfrom airflow import DAG\nfrom airflow.providers.standard.operators.python import PythonOperator\nfrom airflow.providers.postgres.hooks.postgres import PostgresHook\nfrom datetime import datetime, timedelta\nimport json\nimport requests\nfrom collections import defaultdict\n\n\nCLICKHOUSE_URL = \"http://clickhouse.infra.svc.cluster.local:8123/\"\nCLICKHOUSE_PARAMS = {\"user\": \"admin\", \"password\": \"admin\"}\nBATCH_SIZE = 5000\n\n\ndef extract_from_postgres(**context):\n    \"\"\"\u0427\u0438\u0442\u0430\u0435\u043C \u0441\u044B\u0440\u044B\u0435 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0438\u0438 \u0438\u0437 PG.\"\"\"\n    pg_hook = PostgresHook(postgres_conn_id='postgres_farcana')\n    sql = \"\"\"\n        SELECT id, statement_date, bank_code, total_amount, processed_at\n        FROM bank_statements\n        WHERE synced_to_ch = FALSE\n        ORDER BY id ASC\n        LIMIT %s\n    \"\"\"\n    records = pg_hook.get_records(sql, parameters=(BATCH_SIZE,))\n    if not records:\n        print(\"No new records\")\n        return []\n    data = [dict(zip(\n        ['id', 'statement_date', 'bank_code', 'total_amount', 'processed_at'],\n        r\n    )) for r in records]\n    print(f\"Extracted {len(data)} bank_statements from PostgreSQL\")\n    return data\n\n\ndef load_to_clickhouse(**context):\n    \"\"\"\u0410\u0433\u0440\u0435\u0433\u0438\u0440\u0443\u0435\u043C \u0438 \u0432\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u043C \u0432 CH.\"\"\"\n    ti = context['ti']\n    data = ti.xcom_pull(task_ids='extract_from_postgres')\n    if not data:\n        print(\"No data to load\")\n        return 0\n\n    # \u0410\u0433\u0440\u0435\u0433\u0430\u0446\u0438\u044F \u0432 Python: (report_date, bank_code) \u2192 {count, sum}\n    agg = defaultdict(lambda: {\"count\": 0, \"sum\": 0.0})\n    for row in data:\n        report_date = row['statement_date']\n        if hasattr(report_date, 'isoformat'):\n            report_date = report_date.isoformat()\n        key = (report_date, row['bank_code'])\n        agg[key][\"count\"] += 1\n        agg[key][\"sum\"] += float(row['total_amount']) if row['total_amount'] is not None else 0.0\n\n    print(f\"Aggregated {len(data)} raw rows \u2192 {len(agg)} (date, bank) groups\")\n\n    # \u0424\u043E\u0440\u043C\u0438\u0440\u0443\u0435\u043C JSONEachRow \u0434\u043B\u044F \u0432\u0441\u0442\u0430\u0432\u043A\u0438\n    lines = []\n    for (report_date, bank_code), v in agg.items():\n        lines.append(json.dumps({\n            \"report_date\":        report_date,\n            \"bank_code\":          bank_code,\n            \"total_transactions\": v[\"count\"],\n            \"total_volume\":       v[\"sum\"],\n            \"avg_transaction\":    v[\"sum\"] / v[\"count\"] if v[\"count\"] else 0.0,\n        }, ensure_ascii=False))\n\n    body = \"\\n\".join(lines)\n\n    # ReplacingMergeTree: \u0434\u0443\u0431\u043B\u0438\u043A\u0430\u0442\u044B \u0441\u0445\u043B\u043E\u043F\u043D\u0443\u0442\u0441\u044F\n    resp = requests.post(\n        CLICKHOUSE_URL,\n        params={\n            **CLICKHOUSE_PARAMS,\n            \"query\": \"INSERT INTO game_analytics.financial_reports \"\n                     \"(report_date, bank_code, total_transactions, total_volume, avg_transaction) \"\n                     \"FORMAT JSONEachRow\",\n        },\n        data=body.encode(\"utf-8\"),\n        headers={\"Content-Type\": \"application/x-ndjson\"},\n        timeout=60,\n    )\n    if resp.status_code != 200:\n        raise Exception(f\"ClickHouse error ({resp.status_code}): {resp.text[:500]}\")\n\n    # \u041F\u043E\u043C\u0435\u0447\u0430\u0435\u043C raw \u043A\u0430\u043A synced\n    ids = [row['id'] for row in data]\n    pg_hook = PostgresHook(postgres_conn_id='postgres_farcana')\n    pg_hook.run(\n        \"UPDATE bank_statements SET synced_to_ch = TRUE WHERE id = ANY(%s)\",\n        parameters=(ids,),\n    )\n\n    print(f\"Loaded {len(agg)} aggregated rows to ClickHouse (from {len(data)} raw)\")\n    return len(data)\n\n\nwith DAG(\n    dag_id='kyriba_etl',\n    default_args={\n        'owner': 'devops',\n        'depends_on_past': False,\n        'start_date': datetime(2026, 9, 1),\n        'retries': 2,\n        'retry_delay': timedelta(minutes=1),\n    },\n    schedule='*/1 * * * *',\n    catchup=False,\n    max_active_runs=1,\n    max_active_tasks=1,\n    tags=['kyriba', 'etl', 'oltp-olap'],\n) as dag:\n    extract = PythonOperator(task_id='extract_from_postgres', python_callable=extract_from_postgres)\n    load = PythonOperator(task_id='load_to_clickhouse', python_callable=load_to_clickhouse)\n    extract >> load\n"
