# ═══ Airflow 3.2.2 — cloud-lab D1 ═══
executor: CeleryExecutor

workers:
  replicas: 1

createUserJob:
  defaultUser:
    username: admin
    password: admin

redis:
  enabled: true

postgresql:
  enabled: true

apiSecretKey: "cloud-lab-static-api-secret-key-2026"

# ─── DAGs: PVC mount во ВСЕ компоненты ───
# Chart сам создаст PVC (persistence.enabled: true),
# а extraVolumes/extraVolumeMounts монтируют его в каждый компонент.
dags:
  persistence:
    enabled: true
    storageClassName: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
  gitSync:
    enabled: false

# ─── Config ───
airflow:
  config:
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

# ─── Connection через env (secrets backend) ───
# ВАЖНО: extraEnv, НЕ config. config пишет в airflow.cfg, extraEnv — в process env.
  extraEnv:
    - name: AIRFLOW_CONN_POSTGRES_FARCANA
      value: "postgres://admin:postgres@postgres.infra.svc.cluster.local:5432/farcana"

# ─── NodeSelector + DAG-PVC mount для каждого компонента ───
scheduler:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
  extraVolumes:
    - name: dags-pvc
      persistentVolumeClaim:
        claimName: airflow-dags
  extraVolumeMounts:
    - name: dags-pvc
      mountPath: /opt/airflow/dags

dagProcessor:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
  extraVolumes:
    - name: dags-pvc
      persistentVolumeClaim:
        claimName: airflow-dags
  extraVolumeMounts:
    - name: dags-pvc
      mountPath: /opt/airflow/dags

workers:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
  # chart 1.22 deprecation: используем celery.extraVolumes
  celery:
    extraVolumes:
      - name: dags-pvc
        persistentVolumeClaim:
          claimName: airflow-dags
    extraVolumeMounts:
      - name: dags-pvc
        mountPath: /opt/airflow/dags

apiServer:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
  extraVolumes:
    - name: dags-pvc
      persistentVolumeClaim:
        claimName: airflow-dags
  extraVolumeMounts:
    - name: dags-pvc
      mountPath: /opt/airflow/dags

triggerer:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
  extraVolumes:
    - name: dags-pvc
      persistentVolumeClaim:
        claimName: airflow-dags
  extraVolumeMounts:
    - name: dags-pvc
      mountPath: /opt/airflow/dags
