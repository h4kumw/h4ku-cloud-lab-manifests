executor: CeleryExecutor
workers:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
  celery:
    extraEnv:
    - name: AIRFLOW_CONN_POSTGRES_FARCANA
      value: postgres://admin:postgres@postgres.infra.svc.cluster.local:5432/farcana
createUserJob:
  defaultUser:
    username: admin
    password: admin
redis:
  enabled: true
postgresql:
  enabled: true
apiSecretKey: cloud-lab-static-api-secret-key-2026
dags:
  persistence:
    enabled: true
    storageClassName: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
  gitSync:
    enabled: false
airflow:
  config:
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  extraEnv:
  - name: AIRFLOW_CONN_POSTGRES_FARCANA
    value: postgres://admin:postgres@postgres.infra.svc.cluster.local:5432/farcana
scheduler:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
dagProcessor:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
apiServer:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
triggerer:
  nodeSelector:
    kubernetes.io/hostname: k3d-cps-lab-agent-0
env:
- name: AIRFLOW_CONN_POSTGRES_FARCANA
  value: postgres://admin:postgres@postgres.infra.svc.cluster.local:5432/farcana
