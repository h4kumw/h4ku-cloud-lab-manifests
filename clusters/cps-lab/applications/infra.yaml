apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/h4kumw/h4ku-cloud-lab-manifests.git
    targetRevision: main
    path: apps/infra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  ignoreDifferences:
    # PVC immutable после создания — ArgoCD не должен пытаться их менять
    - kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
    # Job immutable после запуска — pg-init-schema, ch-init-schema
    - kind: Job
      jsonPointers:
        - /spec/template
        - /status
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
