name: Build Airflow Custom Image

on:
  push:
    paths:
      - 'docker/airflow-custom/**'
      - '.github/workflows/build-airflow.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloud-lab-airflow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/airflow-custom
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:3.2.2-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:3.2.2-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
